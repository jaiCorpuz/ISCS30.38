<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tier 1</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Recursive:slnt,wght,CASL,MONO@-15..0,300..1000,0..1,0..1&display=swap');
      :root {
        --brand: #e17055;
        --brand-light: hsl(12, 70%, 85%);
        --brand-dark: hsl(12 70% 40%);
        --brand-transparent: hsl(12 70% 61% / 0.5);
        --brand-complement: hsl(192 70% 61%);
      }
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #1a1a2e; color: #eee; padding: 2rem; }
      section { margin-bottom: 3rem; }
      section > h3 { color: #888; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.15em; margin-bottom: 1rem; border-bottom: 1px solid #333; padding-bottom: 0.5rem; }
      .swatch-row { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1rem; }
      .swatch { width: 120px; height: 80px; border-radius: 8px; }
      .gradient-row { display: flex; gap: 1.5rem; flex-wrap: wrap; margin-top: 1rem; }
      .gradient-box { width: 200px; height: 200px; border-radius: 12px; }
      .image-row { display: flex; gap: 1rem; flex-wrap: wrap; margin-top: 1rem; }
      .image-row img { width: 220px; height: 160px; object-fit: cover; border-radius: 8px; }
      .fade-container { margin-top: 1rem; height: 200px; overflow: hidden; border-radius: 8px; }
      .fade-container img { width: 100%; height: 300px; object-fit: cover; }

      /* Apply Styles here */
      /*-- 1.1 FONTS --*/
      body {
        font-family: 'Recursive', sans-serif;
        font-size: 1rem;
        line-height: 1.5;
      }
      h1 {
        font-weight: 900;
        font-size: clamp(2rem, 5vw + 1rem, 4rem);
      }
      h2 {
        font-weight: 600;
        font-size: 1.75rem;
      }
      .casual {
        font-variation-settings: "CASL" 1;
      }
      .mono {
        font-variation-settings: "MONO" 1; 
      }

      /*-- 1.3 GRADIENTS--*/
      .gradient-linear {
        background-image: linear-gradient(50deg, #2A7B9B, #DC8AFF);
      }
      .gradient-radial {
        background-image: radial-gradient(#FFFF8C, #BD3E58);
      }
      .gradient-conic {
        background-image: conic-gradient(#A18A37, #CFF09E, #3EA4BD);
      }

      /*--FILTERS--*/
      .image-row img{
        filter: grayscale(70%) brightness(0.6);
        transition: filter 0.3s ease-in-out;
        cursor: pointer;
      }

      .image-row img:hover {
        filter: grayscale(0) brightness(1);
      }

      /*--MASKS--*/
      .fade-bottom {
        -webkit-mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
        mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
      }
    </style>
  </head>
  <body>
    <!-- 1.1 FONTS -->
    <section>
      <h3>1.1 — Fonts</h3>
      <h1>Variable Font Heading</h1>
      <h2>Secondary Heading</h2>
      <p class="casual">This paragraph should look casual and proportional.</p>
      <p class="mono">This paragraph should look monospaced and structured.</p>
      <p>This is default body text using Recursive at its base settings.</p>
    </section>

    <!-- 1.2 COLORS -->
    <section>
      <h3>1.2 — Colors</h3>
      <div class="swatch-row">
        <div class="swatch" style="background: var(--brand);" title="Brand"></div>
        <div class="swatch" style="background: var(--brand-light);" title="Light"></div>
        <div class="swatch" style="background: var(--brand-dark);" title="Dark"></div>
        <div class="swatch" style="background: var(--brand-transparent);" title="Transparent"></div>
        <div class="swatch" style="background: var(--brand-complement);" title="Complement"></div>
      </div>
    </section>

    <!-- 1.3 GRADIENTS -->
    <section>
      <h3>1.3 — Gradients</h3>
      <div class="gradient-row">
        <div class="gradient-box gradient-linear"></div>
        <div class="gradient-box gradient-radial"></div>
        <div class="gradient-box gradient-conic"></div>
      </div>
    </section>

    <!-- 1.4 FILTERS -->
    <section>
      <h3>1.4 — Filters</h3>
      <div class="image-row">
        <img src="https://picsum.photos/seed/a1/400/300" alt="Sample 1">
        <img src="https://picsum.photos/seed/b2/400/300" alt="Sample 2">
        <img src="https://picsum.photos/seed/c3/400/300" alt="Sample 3">
      </div>
    </section>

    <!-- 1.5 MASKS -->
    <section>
      <h3>1.5 — Masks</h3>
      <div class="fade-container fade-bottom">
        <img src="https://picsum.photos/seed/mask1/800/400" alt="Fading image">
      </div>
    </section>
  </body>
</html>
